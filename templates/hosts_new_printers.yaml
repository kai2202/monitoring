          interface_ref: if1
          description: Kham pha tu dong hop muc va hop muc thai tu prtMarkerSuppliesTable.
          item_prototypes:
            - name: "Supply: {#SUPPLY_DESCR} (Level Raw)"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.{#SNMPINDEX}
              key: printer.supply.level.raw[{#SNMPINDEX}]
              delay: 10m
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: "%"
              interface_ref: if1
              tags:
                - tag: scope
                  value: supplies
                - tag: supply
                  value: "{#SUPPLY_DESCR}"
            - name: "Supply: {#SUPPLY_DESCR} (Level %)"
              type: CALCULATED
              key: printer.supply.level.percent[{#SNMPINDEX}]
              delay: 10m
              history: 14d
              trends: 365d
              value_type: FLOAT
              units: "%"
              params: last(//printer.supply.level.raw[{#SNMPINDEX}])
              tags:
                - tag: scope
                  value: supplies
                - tag: supply
                  value: "{#SUPPLY_DESCR}"
              trigger_prototypes:
                - expression: last(/AB1_Tang_6_nhan_su/printer.supply.level.percent[{#SNMPINDEX}])<15 and last(/AB1_Tang_6_nhan_su/printer.supply.level.percent[{#SNMPINDEX}])>=0 and {#SUPPLY_TYPE}<>4
                  name: "Supply level is low: {#SUPPLY_DESCR} (< 15%)"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: supplies
                - expression: last(/AB1_Tang_6_nhan_su/printer.supply.level.percent[{#SNMPINDEX}])<=2 and last(/AB1_Tang_6_nhan_su/printer.supply.level.percent[{#SNMPINDEX}])>=0 and {#SUPPLY_TYPE}<>4
                  name: "Supply is empty: {#SUPPLY_DESCR} (<= 2%)"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: supplies
                - expression: last(/AB1_Tang_6_nhan_su/printer.supply.level.percent[{#SNMPINDEX}])<=10 and {#SUPPLY_TYPE}=4
                  name: Waste toner container is almost full ({#SUPPLY_DESCR})
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: waste-toner
        - name: Printer Alerts Discovery
          type: SNMP_AGENT
          snmp_oid: discovery[{#ALERT_CODE},1.3.6.1.2.1.43.18.1.1.7.1,{#ALERT_SEV},1.3.6.1.2.1.43.18.1.1.2.1,{#ALERT_GROUP},1.3.6.1.2.1.43.18.1.1.4.1]
          key: printer.alerts.discovery
          delay: 1m
          interface_ref: if1
          description: Tu dong phat hien canh bao loi phan cung tu prtAlertTable.
          item_prototypes:
            - name: "Alert [{#SNMPINDEX}]: Description"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.18.1.1.8.1.{#SNMPINDEX}
              key: printer.alert.description[{#SNMPINDEX}]
              delay: 1m
              history: 7d
              trends: "0"
              value_type: CHAR
              interface_ref: if1
              tags:
                - tag: scope
                  value: alerts
            - name: "Alert [{#SNMPINDEX}]: Severity Level"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.18.1.1.2.1.{#SNMPINDEX}
              key: printer.alert.severity[{#SNMPINDEX}]
              delay: 1m
              history: 7d
              trends: 365d
              value_type: UNSIGNED
              interface_ref: if1
              tags:
                - tag: scope
                  value: alerts
              trigger_prototypes:
                - expression: last(/AB1_Tang_6_nhan_su/printer.alert.severity[{#SNMPINDEX}])=3
                  name: "AB1_Tang_6_nhan_su Warning: {ITEM.VALUE1}"
                  event_name: "Printer Warning: {?last(//printer.alert.description[{#SNMPINDEX}])}"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: hardware-alert
                - expression: last(/AB1_Tang_6_nhan_su/printer.alert.severity[{#SNMPINDEX}])>=4
                  name: "AB1_Tang_6_nhan_su Hardware Error: {ITEM.VALUE1}"
                  event_name: "Printer Hardware Error: {?last(//printer.alert.description[{#SNMPINDEX}])}"
                  priority: HIGH
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: hardware-error
      valuemaps:
        - name: Service state
          mappings:
            - value: "0"
              newvalue: Down
            - value: "1"
              newvalue: Up
        - name: "Printer status (RFC 2790)"
          mappings:
            - value: "1"
              newvalue: Other
            - value: "2"
              newvalue: Unknown
            - value: "3"
              newvalue: Idle / Ready
            - value: "4"
              newvalue: Printing
            - value: "5"
              newvalue: Warmup
        - name: "Cover status (RFC 3805)"
          mappings:
            - value: "1"
