        - name: "Ricoh: Scanner Share Status"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.2.11.0
          key: ricoh.scanner.status
          delay: 2m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Trang thai san sang cua khoi quet Scanner (1=Available, 2=Busy, >2=Error).
          tags:
            - tag: scope
              value: hardware
        - name: "Ricoh: MFP Error Summary Bitmask"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.2.20.0
          key: ricoh.mfp.error.summary
          delay: 1m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Bitmask loi he thong nen tang MFP (0=Binh thuong, >0=Loi he thong SC).
          tags:
            - tag: scope
              value: hardware
          triggers:
            - expression: last(/AC_Kaizen/ricoh.mfp.error.summary)>0
              name: AC_Kaizen MFP System Error Detected
              priority: HIGH
              description: Khoi dong co MFP phat hien loi he thong phan cung (Service Call SC).
              tags:
                - tag: class
                  value: hardware-error
        - name: "Ricoh: Copier Error Summary Bitmask"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.2.22.0
          key: ricoh.copier.error.summary
          delay: 1m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Bitmask canh bao ung dung sao chup Copier.
          tags:
            - tag: scope
              value: hardware
      discovery_rules:
        - name: Supplies Discovery
          type: SNMP_AGENT
          snmp_oid: discovery[{#SUPPLY_DESCR},1.3.6.1.2.1.43.11.1.1.6.1,{#SUPPLY_MAX},1.3.6.1.2.1.43.11.1.1.8.1,{#SUPPLY_TYPE},1.3.6.1.2.1.43.11.1.1.5.1]
          key: printer.supplies.discovery
          delay: 1h
          interface_ref: if1
          description: Kham pha tu dong hop muc va hop muc thai tu prtMarkerSuppliesTable.
          item_prototypes:
            - name: "Supply: {#SUPPLY_DESCR} (Level Raw)"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.{#SNMPINDEX}
              key: printer.supply.level.raw[{#SNMPINDEX}]
              delay: 10m
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: "%"
              interface_ref: if1
              tags:
                - tag: scope
                  value: supplies
                - tag: supply
                  value: "{#SUPPLY_DESCR}"
            - name: "Supply: {#SUPPLY_DESCR} (Level %)"
              type: CALCULATED
              key: printer.supply.level.percent[{#SNMPINDEX}]
              delay: 10m
              history: 14d
              trends: 365d
              value_type: FLOAT
              units: "%"
              params: last(//printer.supply.level.raw[{#SNMPINDEX}])
              tags:
                - tag: scope
                  value: supplies
                - tag: supply
                  value: "{#SUPPLY_DESCR}"
              trigger_prototypes:
                - expression: last(/AC_Kaizen/printer.supply.level.percent[{#SNMPINDEX}])<15 and last(/AC_Kaizen/printer.supply.level.percent[{#SNMPINDEX}])>=0 and {#SUPPLY_TYPE}<>4
                  name: "Supply level is low: {#SUPPLY_DESCR} (< 15%)"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: supplies
                - expression: last(/AC_Kaizen/printer.supply.level.percent[{#SNMPINDEX}])<=2 and last(/AC_Kaizen/printer.supply.level.percent[{#SNMPINDEX}])>=0 and {#SUPPLY_TYPE}<>4
                  name: "Supply is empty: {#SUPPLY_DESCR} (<= 2%)"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: supplies
                - expression: last(/AC_Kaizen/printer.supply.level.percent[{#SNMPINDEX}])<=10 and {#SUPPLY_TYPE}=4
                  name: Waste toner container is almost full ({#SUPPLY_DESCR})
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: waste-toner
        - name: Printer Alerts Discovery
          type: SNMP_AGENT
          snmp_oid: discovery[{#ALERT_CODE},1.3.6.1.2.1.43.18.1.1.7.1,{#ALERT_SEV},1.3.6.1.2.1.43.18.1.1.2.1,{#ALERT_GROUP},1.3.6.1.2.1.43.18.1.1.4.1]
          key: printer.alerts.discovery
          delay: 1m
          interface_ref: if1
          description: Tu dong phat hien canh bao loi phan cung tu prtAlertTable.
          item_prototypes:
            - name: "Alert [{#SNMPINDEX}]: Description"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.18.1.1.8.1.{#SNMPINDEX}
              key: printer.alert.description[{#SNMPINDEX}]
              delay: 1m
              history: 7d
              trends: "0"
              value_type: CHAR
              interface_ref: if1
              tags:
                - tag: scope
                  value: alerts
            - name: "Alert [{#SNMPINDEX}]: Severity Level"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.18.1.1.2.1.{#SNMPINDEX}
              key: printer.alert.severity[{#SNMPINDEX}]
              delay: 1m
              history: 7d
              trends: 365d
              value_type: UNSIGNED
              interface_ref: if1
              tags:
                - tag: scope
                  value: alerts
              trigger_prototypes:
                - expression: last(/AC_Kaizen/printer.alert.severity[{#SNMPINDEX}])=3
                  name: "AC_Kaizen Warning: {ITEM.VALUE1}"
                  event_name: "Printer Warning: {?last(//printer.alert.description[{#SNMPINDEX}])}"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: hardware-alert
                - expression: last(/AC_Kaizen/printer.alert.severity[{#SNMPINDEX}])>=4
                  name: "AC_Kaizen Hardware Error: {ITEM.VALUE1}"
                  event_name: "Printer Hardware Error: {?last(//printer.alert.description[{#SNMPINDEX}])}"
                  priority: HIGH
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: hardware-error
      valuemaps:
        - name: Service state
          mappings:
            - value: "0"
              newvalue: Down
            - value: "1"
              newvalue: Up
        - name: "Printer status (RFC 2790)"
          mappings:
            - value: "1"
              newvalue: Other
            - value: "2"
              newvalue: Unknown
            - value: "3"
              newvalue: Idle / Ready
            - value: "4"
              newvalue: Printing
            - value: "5"
              newvalue: Warmup
        - name: "Cover status (RFC 3805)"
          mappings:
            - value: "1"
              newvalue: Other
            - value: "2"
              newvalue: Unknown
            - value: "3"
              newvalue: Open
            - value: "4"
              newvalue: Closed
            - value: "5"
              newvalue: Interlock Open
            - value: "6"
              newvalue: Interlock Closed

