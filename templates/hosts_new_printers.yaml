              value: identity
        - name: "System: Uptime"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: system.uptime
          delay: 5m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          units: uptime
          interface_ref: if1
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - "0.01"
          description: Thoi gian may in hoat dong lien tuc (sysUpTime).
          tags:
            - tag: scope
              value: availability
