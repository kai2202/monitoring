zabbix_export:
  version: "7.0"
  host_groups:
    - uuid: 7df96b18c230490a9a0f9e2307226338
      name: Applications
  hosts:
    - host: AB1_Tang_tret_le_tan
      name: AB1_Tang_tret_le_tan (10.48.90.221 - Canon LBP 223)
      description: May in Canon LBP 223dw - AB1 Tang tret le tan
      status: ENABLED
      groups:
        - name: Applications
      interfaces:
        - default: "YES"
          type: SNMP
          useip: "YES"
          ip: 10.48.90.221
          dns: ""
          port: "161"
          details:
            version: SNMPV1
            community: "{$SNMP_COMMUNITY}"
          interface_ref: if1
      inventory_mode: DISABLED
      macros:
        - macro: "{$SNMP_COMMUNITY}"
          value: public
      items:
        - name: "Printer: ICMP ping"
          type: SIMPLE
          key: icmpping
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Kiem tra tinh san sang cua may in qua ICMP Ping.
          valuemap:
            name: Service state
          tags:
            - tag: scope
              value: availability
          triggers:
            - expression: max(/AB1_Tang_tret_le_tan/icmpping,#3)=0
              name: AB1_Tang_tret_le_tan is unreachable (ICMP ping failed)
              priority: DISASTER
              description: May in khong phan hoi ICMP Ping trong 3 lan kiem tra lien tiep.
              tags:
                - tag: class
                  value: connectivity
        - name: "Printer: ICMP response time"
          type: SIMPLE
          key: icmppingsec
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: s
          interface_ref: if1
          description: Thoi gian phan hoi ICMP ping (Round-trip time).
          tags:
            - tag: scope
              value: performance
        - name: "System: Device description"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: system.descr
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: Mo ta chi tiet he thong tu sysDescr.
          tags:
            - tag: scope
              value: identity
        - name: "System: Device name"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: system.name
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: Ten dinh danh mang cua may in (sysName).
          tags:
            - tag: scope
              value: identity
        - name: "System: Uptime"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: system.uptime
          delay: 5m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          units: uptime
          interface_ref: if1
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - "0.01"
          description: Thoi gian may in hoat dong lien tuc (sysUpTime).
          tags:
            - tag: scope
              value: availability
          triggers:
            - expression: change(/AB1_Tang_tret_le_tan/system.uptime)<0 and /AB1_Tang_tret_le_tan/system.uptime<300
              name: AB1_Tang_tret_le_tan has just rebooted
              priority: INFO
              description: May in vua duoc khoi dong lai.
              manual_close: "YES"
              tags:
                - tag: class
                  value: reboot
        - name: "Printer: Serial number (RFC)"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
          key: printer.serial
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: So serial khung may tu prtGeneralSerialNumber.
          tags:
            - tag: scope
              value: identity
        - name: "Printer: Total lifetime page counter"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
          key: printer.counter.total
          delay: 5m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: Tong so trang in tich luy tron doi (prtMarkerLifeCount).
          tags:
            - tag: scope
              value: telemetry
        - name: "Printer: Operational status (RFC 2790)"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
          key: printer.hr.status
          delay: 2m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: "Trang thai hoat dong may in: 1=other, 2=unknown, 3=idle (san sang), 4=printing (dang in), 5=warmup."
          valuemap:
            name: "Printer status (RFC 2790)"
          tags:
            - tag: scope
              value: status
        - name: "Printer: Hardware error state bitmask (RFC 2790)"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.25.3.5.1.2.1
          key: printer.hr.error
          delay: 1m
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: "Bitmask loi phan cung truc tiep: ket giay, mo nap, het giay, loi service."
          tags:
            - tag: scope
              value: hardware-error
        - name: "Printer: Cover status (RFC 3805)"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.6.1.1.3.1.1
          key: printer.cover.status
          delay: 1m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: "Trang thai cua nap may in chinh: 3=Open (dang mo), 4=Closed (dong kin)."
          valuemap:
            name: "Cover status (RFC 3805)"
          tags:
            - tag: scope
              value: hardware
          triggers:
            - expression: last(/AB1_Tang_tret_le_tan/printer.cover.status)=3
              name: "AB1_Tang_tret_le_tan Printer Cover is Open"
              priority: WARNING
              description: Cua nap may in dang mo hoac bi ho cong tac an toan.
              manual_close: "YES"
              tags:
                - tag: class
                  value: door-open
        - name: "Printer: Pages since power on (RFC 3805)"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.10.2.1.5.1.1
          key: printer.counter.poweron
          delay: 15m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: So trang in thuc hien tinh tu lan bat nguon / khoi dong gan nhat (prtMarkerPowerOnCount).
          tags:
            - tag: scope
              value: telemetry
        - name: "Canon: Duplex 2-Sided Print Counter"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1602.1.11.2.1.1.3.10
          key: canon.counter.duplex
          delay: 15m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: Tong so trang in dao 2 mat tu dong tu chip Canon Enterprise Counter.
          tags:
            - tag: scope
              value: telemetry
      discovery_rules:
        - name: Supplies Discovery
          type: SNMP_AGENT
          snmp_oid: discovery[{#SUPPLY_DESCR},1.3.6.1.2.1.43.11.1.1.6.1,{#SUPPLY_MAX},1.3.6.1.2.1.43.11.1.1.8.1,{#SUPPLY_TYPE},1.3.6.1.2.1.43.11.1.1.5.1]
          key: printer.supplies.discovery
          delay: 1h
          interface_ref: if1
          description: Kham pha tu dong hop muc va hop muc thai tu prtMarkerSuppliesTable.
          item_prototypes:
            - name: "Supply: {#SUPPLY_DESCR} (Level Raw)"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.{#SNMPINDEX}
              key: printer.supply.level.raw[{#SNMPINDEX}]
              delay: 10m
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: "%"
              interface_ref: if1
              tags:
                - tag: scope
                  value: supplies
                - tag: supply
                  value: "{#SUPPLY_DESCR}"
            - name: "Supply: {#SUPPLY_DESCR} (Level %)"
              type: CALCULATED
              key: printer.supply.level.percent[{#SNMPINDEX}]
              delay: 10m
              history: 14d
              trends: 365d
              value_type: FLOAT
              units: "%"
              params: last(//printer.supply.level.raw[{#SNMPINDEX}])
              tags:
                - tag: scope
                  value: supplies
                - tag: supply
                  value: "{#SUPPLY_DESCR}"
              trigger_prototypes:
                - expression: last(/AB1_Tang_tret_le_tan/printer.supply.level.percent[{#SNMPINDEX}])<15 and last(/AB1_Tang_tret_le_tan/printer.supply.level.percent[{#SNMPINDEX}])>=0 and {#SUPPLY_TYPE}<>4
                  name: "Supply level is low: {#SUPPLY_DESCR} (< 15%)"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: supplies
                - expression: last(/AB1_Tang_tret_le_tan/printer.supply.level.percent[{#SNMPINDEX}])<=2 and last(/AB1_Tang_tret_le_tan/printer.supply.level.percent[{#SNMPINDEX}])>=0 and {#SUPPLY_TYPE}<>4
                  name: "Supply is empty: {#SUPPLY_DESCR} (<= 2%)"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: supplies
                - expression: last(/AB1_Tang_tret_le_tan/printer.supply.level.percent[{#SNMPINDEX}])<=10 and {#SUPPLY_TYPE}=4
                  name: Waste toner container is almost full ({#SUPPLY_DESCR})
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: waste-toner
        - name: Printer Alerts Discovery
          type: SNMP_AGENT
          snmp_oid: discovery[{#ALERT_CODE},1.3.6.1.2.1.43.18.1.1.7.1,{#ALERT_SEV},1.3.6.1.2.1.43.18.1.1.2.1,{#ALERT_GROUP},1.3.6.1.2.1.43.18.1.1.4.1]
          key: printer.alerts.discovery
          delay: 1m
          interface_ref: if1
          description: Tu dong phat hien canh bao loi phan cung tu prtAlertTable.
          item_prototypes:
            - name: "Alert [{#SNMPINDEX}]: Description"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.18.1.1.8.1.{#SNMPINDEX}
              key: printer.alert.description[{#SNMPINDEX}]
              delay: 1m
              history: 7d
              trends: "0"
              value_type: CHAR
              interface_ref: if1
              tags:
                - tag: scope
                  value: alerts
            - name: "Alert [{#SNMPINDEX}]: Severity Level"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.18.1.1.2.1.{#SNMPINDEX}
              key: printer.alert.severity[{#SNMPINDEX}]
              delay: 1m
              history: 7d
              trends: 365d
              value_type: UNSIGNED
              interface_ref: if1
              tags:
                - tag: scope
                  value: alerts
              trigger_prototypes:
                - expression: last(/AB1_Tang_tret_le_tan/printer.alert.severity[{#SNMPINDEX}])=3
                  name: "AB1_Tang_tret_le_tan Warning: {ITEM.VALUE1}"
                  event_name: "Printer Warning: {?last(//printer.alert.description[{#SNMPINDEX}])}"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: hardware-alert
                - expression: last(/AB1_Tang_tret_le_tan/printer.alert.severity[{#SNMPINDEX}])>=4
                  name: "AB1_Tang_tret_le_tan Hardware Error: {ITEM.VALUE1}"
                  event_name: "Printer Hardware Error: {?last(//printer.alert.description[{#SNMPINDEX}])}"
                  priority: HIGH
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: hardware-error
      valuemaps:
        - name: Service state
          mappings:
            - value: "0"
              newvalue: Down
            - value: "1"
              newvalue: Up
        - name: "Printer status (RFC 2790)"
          mappings:
            - value: "1"
              newvalue: Other
            - value: "2"
              newvalue: Unknown
            - value: "3"
              newvalue: Idle / Ready
            - value: "4"
              newvalue: Printing
            - value: "5"
              newvalue: Warmup
        - name: "Cover status (RFC 3805)"
          mappings:
            - value: "1"
              newvalue: Other
            - value: "2"
              newvalue: Unknown
            - value: "3"
              newvalue: Open
            - value: "4"
              newvalue: Closed
            - value: "5"
              newvalue: Interlock Open
            - value: "6"
              newvalue: Interlock Closed

