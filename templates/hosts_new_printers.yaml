        - name: "Printer: ICMP ping"
          type: SIMPLE
          key: icmpping
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Kiem tra tinh san sang cua may in qua ICMP Ping.
          valuemap:
            name: Service state
          tags:
            - tag: scope
              value: availability
          triggers:
            - expression: max(/Da_Nang_Ricoh_2/icmpping,#3)=0
              name: Da_Nang_Ricoh_2 is unreachable (ICMP ping failed)
              priority: DISASTER
              description: May in khong phan hoi ICMP Ping trong 3 lan kiem tra lien tiep.
              tags:
                - tag: class
                  value: connectivity
