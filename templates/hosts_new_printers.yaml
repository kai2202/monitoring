      name: Da_Nang_Ricoh_2 (192.168.31.249 - Ricoh MP 3054)
      description: May in Ricoh MP 3054 (Mono MFP) - Da Nang 2
      status: ENABLED
      groups:
        - name: Applications
      interfaces:
        - default: "YES"
          type: SNMP
          useip: "YES"
          ip: 192.168.31.249
          dns: ""
          port: "161"
          details:
            version: SNMPV2
            community: "{$SNMP_COMMUNITY}"
          interface_ref: if1
