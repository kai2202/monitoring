zabbix_export:
  version: "7.0"
  host_groups:
    - uuid: 7df96b18c230490a9a0f9e2307226338
      name: Applications
  hosts:
    # =========================================================================
    # Host 1: AB1_Tang_2_RDD (10.48.3.252 - Ricoh MP C6004 Color MFP)
    # =========================================================================
    - host: AB1_Tang_2_RDD
      name: AB1_Tang_2_RDD (10.48.3.252 - Ricoh MP C6004)
      description: May in Ricoh MP C6004 (Color MFP) - Serial G736M860609 - FW 1.43
      status: ENABLED
      groups:
        - name: Applications
      interfaces:
        - default: "YES"
          type: SNMP
          useip: "YES"
          ip: 10.48.3.252
          dns: ""
          port: "161"
          details:
            version: SNMPV2
            community: "{$SNMP_COMMUNITY}"
          interface_ref: if1
      inventory_mode: DISABLED
      macros:
        - macro: "{$SNMP_COMMUNITY}"
          value: public
      items:
        # --- 1. Connectivity & Performance ---
        - name: "Printer: ICMP ping"
          type: SIMPLE
          key: icmpping
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Kiem tra tinh san sang cua may in qua ICMP Ping.
          valuemap:
            name: Service state
          tags:
            - tag: scope
              value: availability
          triggers:
            - expression: max(/AB1_Tang_2_RDD/icmpping,#3)=0
              name: AB1_Tang_2_RDD is unreachable (ICMP ping failed)
              priority: DISASTER
              description: May in khong phan hoi ICMP Ping trong 3 lan kiem tra lien tiep.
              tags:
                - tag: class
                  value: connectivity
        - name: "Printer: ICMP response time"
          type: SIMPLE
          key: icmppingsec
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: s
          interface_ref: if1
          description: Thoi gian phan hoi ICMP ping (Round-trip time).
          tags:
            - tag: scope
              value: performance

        # --- 2. Identity & Hardware Specifications ---
        - name: "System: Device description"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: system.descr
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: Mo ta chi tiet he thong tu sysDescr.
          tags:
            - tag: scope
              value: identity
        - name: "System: Device name"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: system.name
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: Ten dinh danh mang cua may in (sysName).
          tags:
            - tag: scope
              value: identity
        - name: "System: Uptime"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: system.uptime
          delay: 5m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          units: uptime
          interface_ref: if1
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - "0.01"
          description: Thoi gian may in hoat dong lien tuc (sysUpTime).
          tags:
            - tag: scope
              value: availability
          triggers:
            - expression: change(/AB1_Tang_2_RDD/system.uptime)<0 and last(/AB1_Tang_2_RDD/system.uptime)<300
              name: AB1_Tang_2_RDD has just rebooted
              priority: INFO
              description: May in vua duoc khoi dong lai dot ngot.
              manual_close: "YES"
              tags:
                - tag: class
                  value: reboot
        - name: "Printer: Serial number (RFC)"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
          key: printer.serial
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: So serial khung may tu prtGeneralSerialNumber.
          tags:
            - tag: scope
              value: identity
        - name: "Ricoh: Printer Model"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.1.1.1.0
          key: ricoh.model
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: Ten dinh danh model may in Ricoh.
          tags:
            - tag: scope
              value: identity
        - name: "Ricoh: Firmware Version"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.1.1.2.0
          key: ricoh.firmware
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: Phien ban firmware dieu khien he thong Ricoh.
          tags:
            - tag: scope
              value: identity
        - name: "Ricoh: Engine Serial Number"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.1.4.0
          key: ricoh.engine.serial
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: So serial dong co in Ricoh.
          tags:
            - tag: scope
              value: identity

        # --- 3. Device Status & Proactive Error Detection ---
        - name: "Printer: Device Status (RFC 2790)"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.25.3.2.1.5.1
          key: hrDeviceStatus
          delay: 1m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Trang thai thiet bi tong the (1=Unknown, 2=Running, 3=Warning, 4=Testing, 5=Down).
          valuemap:
            name: hrDeviceStatus
          tags:
            - tag: scope
              value: hardware
          triggers:
            - expression: last(/AB1_Tang_2_RDD/hrDeviceStatus)=5
              name: AB1_Tang_2_RDD Device is Down (Hardware Failure)
              priority: HIGH
              description: Bo mach thiet bi bao loi phan cung nghiem trong (hrDeviceStatus=Down).
              tags:
                - tag: class
                  value: hardware-error
        - name: "Printer: Status (RFC 2790)"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
          key: hrPrinterStatus
          delay: 1m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Trang thai hoat dong may in (1=Other, 2=Unknown, 3=Idle, 4=Printing, 5=Warmup).
          tags:
            - tag: scope
              value: hardware
        - name: "Printer: Detected Error State (RFC 2790)"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.25.3.5.1.2.1
          key: hrPrinterDetectedErrorState
          delay: 1m
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: Cờ bitmask bao loi phan cung tu bo mach (jam, doorOpen, noPaper, noToner, etc.).
          tags:
            - tag: scope
              value: hardware
        - name: "Printer: Console LCD Display Message"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.16.5.1.2.1.1.1
          key: printer.display_text
          delay: 1m
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: Thong diep dong chu canh bao hien thi tren man hinh LCD may in.
          tags:
            - tag: scope
              value: alerts

        # --- 4. Ricoh Hardware Service Call (SC) Error Codes ---
        - name: "Ricoh: Active SC Error Code"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.6.1.1.7.1
          key: ricoh.sc_code
          delay: 1m
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: "Ma loi SC dang kich hoat tren he thong Ricoh (vi du: 541, 542, 320, 501)."
          tags:
            - tag: scope
              value: hardware
          triggers:
            - expression: length(last(/AB1_Tang_2_RDD/ricoh.sc_code))>0 and last(/AB1_Tang_2_RDD/ricoh.sc_code)<>"0"
              name: "AB1_Tang_2_RDD Service Call: SC{ITEM.VALUE1}"
              priority: HIGH
              description: "May in Ricoh bao ma loi Service Call SC{ITEM.VALUE1} can ky thuat vien xu ly."
              tags:
                - tag: class
                  value: hardware-error
        - name: "Ricoh: MFP Error Summary Bitmask"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.2.20.0
          key: ricoh.mfp.error.summary
          delay: 1m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Bitmask loi he thong nen tang MFP (0=Binh thuong, >0=Loi he thong SC).
          tags:
            - tag: scope
              value: hardware
          triggers:
            - expression: last(/AB1_Tang_2_RDD/ricoh.mfp.error.summary)>0
              name: AB1_Tang_2_RDD MFP System Error Detected
              priority: HIGH
              description: Khoi dong co MFP phat hien loi he thong phan cung (Service Call SC).
              tags:
                - tag: class
                  value: hardware-error
        - name: "Ricoh: Copier Error Summary Bitmask"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.2.22.0
          key: ricoh.copier.error.summary
          delay: 1m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Bitmask canh bao ung dung sao chup Copier.
          tags:
            - tag: scope
              value: hardware

        # --- 5. Page Counters & Volume Telemetry ---
        - name: "Printer: Total Lifetime Page Counter"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
          key: printer.counter_total
          delay: 5m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: Tong so trang in tich luy tron doi (prtMarkerLifeCount).
          tags:
            - tag: scope
              value: telemetry
        - name: "Ricoh: Black/White Lifetime Page Counter"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.19.1.0
          key: printer.counter_mono
          delay: 15m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: Tong so trang in den trang (Mono Life Count).
          tags:
            - tag: scope
              value: telemetry
        - name: "Ricoh: Color Lifetime Page Counter"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.19.2.0
          key: printer.counter_color
          delay: 15m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: Tong so trang in mau (Color Life Count).
          tags:
            - tag: scope
              value: telemetry
        - name: "Ricoh: Print Mode Counter"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.19.2.0
          key: ricoh.counter.print
          delay: 15m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: So trang in mang gui tu may tinh.
          tags:
            - tag: scope
              value: telemetry
        - name: "Ricoh: Copier Mode Counter"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.19.4.0
          key: ricoh.counter.copy
          delay: 15m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: So trang sao chup truc tiep qua mat kinh.
          tags:
            - tag: scope
              value: telemetry
        - name: "Ricoh: Fax Mode Counter"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.19.3.0
          key: ricoh.counter.fax
          delay: 15m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: So trang in tu ban fax nhan duoc.
          tags:
            - tag: scope
              value: telemetry
        - name: "Ricoh: Scanner Share Status"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.2.11.0
          key: printer.counter_scan
          delay: 2m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Trang thai san sang cua khoi quet Scanner (1=Available, 2=Busy, >2=Error).
          tags:
            - tag: scope
              value: hardware
        - name: "Ricoh: Glass Original Sensor Status"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.2.12.0
          key: ricoh.glass.sensor
          delay: 2m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Cam bien giay dat tren mat kinh (1=Original Present, 2=Empty).
          tags:
            - tag: scope
              value: hardware


        # --- 6. Consumables: CMYK Toner & Waste Box (Color MFP) ---
        - name: "Ricoh: Black Toner Level %"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.24.1.1.5.1
          key: printer.toner_black
          delay: 10m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: "%"
          interface_ref: if1
          description: Phan tram hop muc den Black con lai.
          tags:
            - tag: scope
              value: supplies
          triggers:
            - expression: last(/AB1_Tang_2_RDD/printer.toner_black)<15 and last(/AB1_Tang_2_RDD/printer.toner_black)>2
              name: "AB1_Tang_2_RDD Black Toner is Low (< 15%)"
              priority: WARNING
              manual_close: "YES"
              tags:
                - tag: class
                  value: supplies
            - expression: last(/AB1_Tang_2_RDD/printer.toner_black)<=2 and last(/AB1_Tang_2_RDD/printer.toner_black)>=0
              name: "AB1_Tang_2_RDD Black Toner is Empty (<= 2%)"
              priority: HIGH
              manual_close: "YES"
              tags:
                - tag: class
                  value: supplies
        - name: "Ricoh: Cyan Toner Level %"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.24.1.1.5.2
          key: printer.toner_cyan
          delay: 10m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: "%"
          interface_ref: if1
          description: Phan tram hop muc xanh Cyan con lai.
          tags:
            - tag: scope
              value: supplies
          triggers:
            - expression: last(/AB1_Tang_2_RDD/printer.toner_cyan)<15 and last(/AB1_Tang_2_RDD/printer.toner_cyan)>2
              name: "AB1_Tang_2_RDD Cyan Toner is Low (< 15%)"
              priority: WARNING
              manual_close: "YES"
              tags:
                - tag: class
                  value: supplies
            - expression: last(/AB1_Tang_2_RDD/printer.toner_cyan)<=2 and last(/AB1_Tang_2_RDD/printer.toner_cyan)>=0
              name: "AB1_Tang_2_RDD Cyan Toner is Empty (<= 2%)"
              priority: HIGH
              manual_close: "YES"
              tags:
                - tag: class
                  value: supplies
        - name: "Ricoh: Magenta Toner Level %"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.24.1.1.5.3
          key: printer.toner_magenta
          delay: 10m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: "%"
          interface_ref: if1
          description: Phan tram hop muc do Magenta con lai.
          tags:
            - tag: scope
              value: supplies
          triggers:
            - expression: last(/AB1_Tang_2_RDD/printer.toner_magenta)<15 and last(/AB1_Tang_2_RDD/printer.toner_magenta)>2
              name: "AB1_Tang_2_RDD Magenta Toner is Low (< 15%)"
              priority: WARNING
              manual_close: "YES"
              tags:
                - tag: class
                  value: supplies
            - expression: last(/AB1_Tang_2_RDD/printer.toner_magenta)<=2 and last(/AB1_Tang_2_RDD/printer.toner_magenta)>=0
              name: "AB1_Tang_2_RDD Magenta Toner is Empty (<= 2%)"
              priority: HIGH
              manual_close: "YES"
              tags:
                - tag: class
                  value: supplies
        - name: "Ricoh: Yellow Toner Level %"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.24.1.1.5.4
          key: printer.toner_yellow
          delay: 10m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: "%"
          interface_ref: if1
          description: Phan tram hop muc vang Yellow con lai.
          tags:
            - tag: scope
              value: supplies
          triggers:
            - expression: last(/AB1_Tang_2_RDD/printer.toner_yellow)<15 and last(/AB1_Tang_2_RDD/printer.toner_yellow)>2
              name: "AB1_Tang_2_RDD Yellow Toner is Low (< 15%)"
              priority: WARNING
              manual_close: "YES"
              tags:
                - tag: class
                  value: supplies
            - expression: last(/AB1_Tang_2_RDD/printer.toner_yellow)<=2 and last(/AB1_Tang_2_RDD/printer.toner_yellow)>=0
              name: "AB1_Tang_2_RDD Yellow Toner is Empty (<= 2%)"
              priority: HIGH
              manual_close: "YES"
              tags:
                - tag: class
                  value: supplies
        - name: "Ricoh: Waste Toner Bottle Status"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.4.2.4.0
          key: printer.waste_toner
          delay: 10m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Trang thai hop muc thai Ricoh (1=Normal, 2=Near Full, 3=Full).
          valuemap:
            name: Ricoh Waste Toner
          tags:
            - tag: scope
              value: supplies
          triggers:
            - expression: last(/AB1_Tang_2_RDD/printer.waste_toner)>=2
              name: AB1_Tang_2_RDD Waste Toner Bottle is Near Full / Full
              priority: WARNING
              description: Hop muc thai cua may in da day hoac sap day, can chuan bi thay the.
              manual_close: "YES"
              tags:
                - tag: class
                  value: waste-toner
      discovery_rules:
        # --- LLD 1: Supplies Discovery (RFC 3805) ---
        - name: Supplies Discovery
          type: SNMP_AGENT
          snmp_oid: discovery[{#SUPPLY_DESCR},1.3.6.1.2.1.43.11.1.1.6.1,{#SUPPLY_MAX},1.3.6.1.2.1.43.11.1.1.8.1,{#SUPPLY_TYPE},1.3.6.1.2.1.43.11.1.1.5.1]
          key: printer.supplies.discovery
          delay: 1h
          interface_ref: if1
          description: Kham pha tu dong hop muc va hop muc thai tu prtMarkerSuppliesTable.
          item_prototypes:
            - name: "Supply: {#SUPPLY_DESCR} (Level Raw)"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.{#SNMPINDEX}
              key: printer.supply.level.raw[{#SNMPINDEX}]
              delay: 10m
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: "%"
              interface_ref: if1
              tags:
                - tag: scope
                  value: supplies
                - tag: supply
                  value: "{#SUPPLY_DESCR}"
            - name: "Supply: {#SUPPLY_DESCR} (Level %)"
              type: CALCULATED
              key: printer.supply.level.percent[{#SNMPINDEX}]
              delay: 10m
              history: 14d
              trends: 365d
              value_type: FLOAT
              units: "%"
              params: last(//printer.supply.level.raw[{#SNMPINDEX}])
              tags:
                - tag: scope
                  value: supplies
                - tag: supply
                  value: "{#SUPPLY_DESCR}"
              trigger_prototypes:
                - expression: last(/AB1_Tang_2_RDD/printer.supply.level.percent[{#SNMPINDEX}])<15 and last(/AB1_Tang_2_RDD/printer.supply.level.percent[{#SNMPINDEX}])>=0 and {#SUPPLY_TYPE}<>4
                  name: "AB1_Tang_2_RDD Supply Low: {#SUPPLY_DESCR} (< 15%)"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: supplies
                - expression: last(/AB1_Tang_2_RDD/printer.supply.level.percent[{#SNMPINDEX}])<=2 and last(/AB1_Tang_2_RDD/printer.supply.level.percent[{#SNMPINDEX}])>=0 and {#SUPPLY_TYPE}<>4
                  name: "AB1_Tang_2_RDD Supply Empty: {#SUPPLY_DESCR} (<= 2%)"
                  priority: HIGH
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: supplies
                - expression: last(/AB1_Tang_2_RDD/printer.supply.level.percent[{#SNMPINDEX}])<=10 and {#SUPPLY_TYPE}=4
                  name: "AB1_Tang_2_RDD Waste Toner Box Full: {#SUPPLY_DESCR}"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: waste-toner

        # --- LLD 2: Printer Alerts Discovery (RFC 3805) ---
        - name: Printer Alerts Discovery
          type: SNMP_AGENT
          snmp_oid: discovery[{#ALERT_CODE},1.3.6.1.2.1.43.18.1.1.7.1,{#ALERT_SEV},1.3.6.1.2.1.43.18.1.1.2.1,{#ALERT_GROUP},1.3.6.1.2.1.43.18.1.1.4.1]
          key: printer.alerts.discovery
          delay: 1m
          interface_ref: if1
          description: Tu dong phat hien canh bao loi phan cung tu prtAlertTable.
          item_prototypes:
            - name: "Alert [{#SNMPINDEX}]: Description"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.18.1.1.8.1.{#SNMPINDEX}
              key: printer.alert.description[{#SNMPINDEX}]
              delay: 1m
              history: 7d
              trends: "0"
              value_type: CHAR
              interface_ref: if1
              tags:
                - tag: scope
                  value: alerts
            - name: "Alert [{#SNMPINDEX}]: Severity Level"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.18.1.1.2.1.{#SNMPINDEX}
              key: printer.alert.severity[{#SNMPINDEX}]
              delay: 1m
              history: 7d
              trends: 365d
              value_type: UNSIGNED
              interface_ref: if1
              tags:
                - tag: scope
                  value: alerts
              trigger_prototypes:
                - expression: last(/AB1_Tang_2_RDD/printer.alert.severity[{#SNMPINDEX}])=3
                  name: "AB1_Tang_2_RDD Warning [{#SNMPINDEX}]: {ITEM.VALUE1}"
                  event_name: "Printer Warning: {?last(//printer.alert.description[{#SNMPINDEX}])}"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
