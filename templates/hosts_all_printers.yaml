                  priority: HIGH
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: supplies
                - expression: last(/AB1_Tang_2_Kaizen/printer.supply.level.percent[{#SNMPINDEX}])<=10 and {#SUPPLY_TYPE}=4
