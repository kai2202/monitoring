        # --- 6. Consumables: Black Toner & Waste Box (Mono MFP) ---
        - name: "Ricoh: Black Toner Level %"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.24.1.1.5.1
          key: printer.toner_black
          delay: 10m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: "%"
          interface_ref: if1
          description: Phan tram hop muc den Black con lai.
          tags:
            - tag: scope
              value: supplies
          triggers:
            - expression: last(/AC_Kaizen/printer.toner_black)<15 and last(/AC_Kaizen/printer.toner_black)>2
              name: "AC_Kaizen Black Toner is Low (< 15%)"
              priority: WARNING
              manual_close: "YES"
              tags:
                - tag: class
                  value: supplies
            - expression: last(/AC_Kaizen/printer.toner_black)<=2 and last(/AC_Kaizen/printer.toner_black)>=0
              name: "AC_Kaizen Black Toner is Empty (<= 2%)"
              priority: HIGH
              manual_close: "YES"
              tags:
                - tag: class
                  value: supplies
        - name: "Ricoh: Waste Toner Bottle Status"
