zabbix_export:
  version: "7.0"
  host_groups:
    - uuid: 7df96b18c230490a9a0f9e2307226338
      name: Applications
  hosts:
    - host: AB1_Tang_2_RDD
      name: AB1_Tang_2_RDD (10.48.3.252 - Ricoh MP C6004)
      description: May in Ricoh MP C6004 (Color MFP) - Serial G736M860609 - FW 1.43
      status: ENABLED
      groups:
        - name: Applications
      interfaces:
        - default: "YES"
          type: SNMP
          useip: "YES"
          ip: 10.48.3.252
          dns: ""
          port: "161"
          details:
            version: SNMPV2
            community: "{$SNMP_COMMUNITY}"
          interface_ref: if1
      inventory_mode: DISABLED
      macros:
        - macro: "{$SNMP_COMMUNITY}"
          value: public
      items:
        - name: "Printer: ICMP ping"
          type: SIMPLE
          key: icmpping
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Kiem tra tinh san sang cua may in qua ICMP Ping.
          valuemap:
            name: Service state
          tags:
            - tag: scope
              value: availability
          triggers:
            - expression: max(/AB1_Tang_2_RDD/icmpping,#3)=0
              name: AB1_Tang_2_RDD is unreachable (ICMP ping failed)
              priority: DISASTER
              description: May in khong phan hoi ICMP Ping trong 3 lan kiem tra lien tiep.
              tags:
                - tag: class
                  value: connectivity
        - name: "Printer: ICMP response time"
          type: SIMPLE
          key: icmppingsec
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: s
          interface_ref: if1
          description: Thoi gian phan hoi ICMP ping (Round-trip time).
          tags:
            - tag: scope
              value: performance
        - name: "System: Device description"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: system.descr
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: Mo ta chi tiet he thong tu sysDescr.
          tags:
            - tag: scope
              value: identity
        - name: "System: Device name"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: system.name
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: Ten dinh danh mang cua may in (sysName).
          tags:
            - tag: scope
              value: identity
        - name: "System: Uptime"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: system.uptime
          delay: 5m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          units: uptime
          interface_ref: if1
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - "0.01"
          description: Thoi gian may in hoat dong lien tuc (sysUpTime).
          tags:
            - tag: scope
              value: availability
          triggers:
            - expression: change(/AB1_Tang_2_RDD/system.uptime)<0 and /AB1_Tang_2_RDD/system.uptime<300
              name: AB1_Tang_2_RDD has just rebooted
              priority: INFO
              description: May in vua duoc khoi dong lai.
              manual_close: "YES"
              tags:
                - tag: class
                  value: reboot
        - name: "Printer: Serial number (RFC)"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
          key: printer.serial
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: So serial khung may tu prtGeneralSerialNumber.
          tags:
            - tag: scope
              value: identity
        - name: "Ricoh: Printer Model"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.1.1.1.0
          key: ricoh.model
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: Ten dinh danh model may in Ricoh.
          tags:
            - tag: scope
              value: identity
        - name: "Ricoh: Firmware Version"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.1.1.2.0
          key: ricoh.firmware
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: Phien ban firmware dieu khien he thong Ricoh.
          tags:
            - tag: scope
              value: identity
        - name: "Ricoh: Engine Serial Number"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.1.4.0
          key: ricoh.engine.serial
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: So serial dong co in Ricoh.
          tags:
            - tag: scope
              value: identity
        - name: "Printer: Total lifetime page counter"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
          key: printer.counter.total
          delay: 5m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: Tong so trang in tich luy tron doi (prtMarkerLifeCount).
          tags:
            - tag: scope
              value: telemetry
        - name: "Ricoh: Print Mode Counter"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.19.2.0
          key: ricoh.counter.print
          delay: 15m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: So trang in mang gui tu may tinh.
          tags:
            - tag: scope
              value: telemetry
        - name: "Ricoh: Copier Mode Counter"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.19.4.0
          key: ricoh.counter.copy
          delay: 15m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: So trang sao chup truc tiep qua mat kinh.
          tags:
            - tag: scope
              value: telemetry
        - name: "Ricoh: Fax Mode Counter"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.19.3.0
          key: ricoh.counter.fax
          delay: 15m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: So trang in tu ban fax nhan duoc.
          tags:
            - tag: scope
              value: telemetry
        - name: "Ricoh: Scanner Share Status"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.2.11.0
          key: ricoh.scanner.status
          delay: 2m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Trang thai san sang cua khoi quet Scanner (1=Available, 2=Busy, >2=Error).
          tags:
            - tag: scope
              value: hardware
        - name: "Ricoh: MFP Error Summary Bitmask"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.2.20.0
          key: ricoh.mfp.error.summary
          delay: 1m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Bitmask loi he thong nen tang MFP (0=Binh thuong, >0=Loi he thong SC).
          tags:
            - tag: scope
              value: hardware
          triggers:
            - expression: last(/AB1_Tang_2_RDD/ricoh.mfp.error.summary)>0
              name: AB1_Tang_2_RDD MFP System Error Detected
              priority: HIGH
              description: Khoi dong co MFP phat hien loi he thong phan cung (Service Call SC).
              tags:
                - tag: class
                  value: hardware-error
        - name: "Ricoh: Copier Error Summary Bitmask"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.2.22.0
          key: ricoh.copier.error.summary
          delay: 1m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Bitmask canh bao ung dung sao chup Copier.
          tags:
            - tag: scope
              value: hardware
        - name: "Ricoh: Black Toner Level %"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.24.1.1.5.1
          key: ricoh.toner.black
          delay: 10m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: "%"
          interface_ref: if1
          description: Phan tram muc den Black con lai.
          tags:
            - tag: scope
              value: supplies
        - name: "Ricoh: Cyan Toner Level %"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.24.1.1.5.2
          key: ricoh.toner.cyan
          delay: 10m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: "%"
          interface_ref: if1
          description: Phan tram muc xanh Cyan con lai.
          tags:
            - tag: scope
              value: supplies
        - name: "Ricoh: Magenta Toner Level %"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.24.1.1.5.3
          key: ricoh.toner.magenta
          delay: 10m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: "%"
          interface_ref: if1
