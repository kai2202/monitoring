        - name: "Ricoh: Black/White Lifetime Page Counter"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.19.1.0
          key: printer.counter_mono
          delay: 15m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: Tong so trang in den trang (Mono Life Count).
          tags:
            - tag: scope
              value: telemetry
        - name: "Ricoh: Print Mode Counter"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.19.2.0
          key: ricoh.counter.print
          delay: 15m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: So trang in mang gui tu may tinh.
          tags:
            - tag: scope
              value: telemetry
        - name: "Ricoh: Copier Mode Counter"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.19.4.0
          key: ricoh.counter.copy
          delay: 15m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: So trang sao chup truc tiep qua mat kinh.
          tags:
            - tag: scope
              value: telemetry
        - name: "Ricoh: Fax Mode Counter"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.19.3.0
          key: ricoh.counter.fax
          delay: 15m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: pages
          interface_ref: if1
          description: So trang in tu ban fax nhan duoc.
          tags:
            - tag: scope
              value: telemetry
        - name: "Ricoh: Scanner Share Status"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.2.11.0
          key: printer.counter_scan
          delay: 2m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Trang thai san sang cua khoi quet Scanner (1=Available, 2=Busy, >2=Error).
          tags:
            - tag: scope
              value: hardware


        # --- 6. Consumables: Black Toner & Waste Box (Mono MFP) ---
        - name: "Ricoh: Black Toner Level %"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.24.1.1.5.1
          key: printer.toner_black
          delay: 10m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          units: "%"
          interface_ref: if1
          description: Phan tram hop muc den Black con lai.
          tags:
            - tag: scope
              value: supplies
          triggers:
            - expression: last(/TTLK_Tra_Vinh/printer.toner_black)<15 and last(/TTLK_Tra_Vinh/printer.toner_black)>2
              name: "TTLK_Tra_Vinh Black Toner is Low (< 15%)"
              priority: WARNING
              manual_close: "YES"
              tags:
                - tag: class
                  value: supplies
            - expression: last(/TTLK_Tra_Vinh/printer.toner_black)<=2 and last(/TTLK_Tra_Vinh/printer.toner_black)>=0
              name: "TTLK_Tra_Vinh Black Toner is Empty (<= 2%)"
              priority: HIGH
              manual_close: "YES"
              tags:
                - tag: class
                  value: supplies
        - name: "Ricoh: Waste Toner Bottle Status"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.367.3.2.1.2.4.2.4.0
          key: printer.waste_toner
          delay: 10m
          history: 14d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Trang thai hop muc thai Ricoh (1=Normal, 2=Near Full, 3=Full).
          valuemap:
            name: Ricoh Waste Toner
          tags:
            - tag: scope
              value: supplies
          triggers:
            - expression: last(/TTLK_Tra_Vinh/printer.waste_toner)>=2
              name: TTLK_Tra_Vinh Waste Toner Bottle is Near Full / Full
              priority: WARNING
              description: Hop muc thai cua may in da day hoac sap day, can chuan bi thay the.
              manual_close: "YES"
              tags:
                - tag: class
                  value: waste-toner
      discovery_rules:
        - name: Supplies Discovery
          type: SNMP_AGENT
          snmp_oid: discovery[{#SUPPLY_DESCR},1.3.6.1.2.1.43.11.1.1.6.1,{#SUPPLY_MAX},1.3.6.1.2.1.43.11.1.1.8.1,{#SUPPLY_TYPE},1.3.6.1.2.1.43.11.1.1.5.1]
          key: printer.supplies.discovery
          delay: 1h
          interface_ref: if1
          description: Kham pha tu dong hop muc va hop muc thai tu prtMarkerSuppliesTable.
          item_prototypes:
            - name: "Supply: {#SUPPLY_DESCR} (Level Raw)"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.{#SNMPINDEX}
              key: printer.supply.level.raw[{#SNMPINDEX}]
              delay: 10m
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: "%"
              interface_ref: if1
              tags:
                - tag: scope
                  value: supplies
                - tag: supply
                  value: "{#SUPPLY_DESCR}"
            - name: "Supply: {#SUPPLY_DESCR} (Level %)"
              type: CALCULATED
              key: printer.supply.level.percent[{#SNMPINDEX}]
              delay: 10m
              history: 14d
              trends: 365d
              value_type: FLOAT
              units: "%"
              params: last(//printer.supply.level.raw[{#SNMPINDEX}])
              tags:
                - tag: scope
                  value: supplies
                - tag: supply
                  value: "{#SUPPLY_DESCR}"
              trigger_prototypes:
                - expression: last(/TTLK_Tra_Vinh/printer.supply.level.percent[{#SNMPINDEX}])<15 and last(/TTLK_Tra_Vinh/printer.supply.level.percent[{#SNMPINDEX}])>=0 and {#SUPPLY_TYPE}<>4
                  name: "TTLK_Tra_Vinh Supply Low: {#SUPPLY_DESCR} (< 15%)"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: supplies
                - expression: last(/TTLK_Tra_Vinh/printer.supply.level.percent[{#SNMPINDEX}])<=2 and last(/TTLK_Tra_Vinh/printer.supply.level.percent[{#SNMPINDEX}])>=0 and {#SUPPLY_TYPE}<>4
                  name: "TTLK_Tra_Vinh Supply Empty: {#SUPPLY_DESCR} (<= 2%)"
                  priority: HIGH
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: supplies
                - expression: last(/TTLK_Tra_Vinh/printer.supply.level.percent[{#SNMPINDEX}])<=10 and {#SUPPLY_TYPE}=4
                  name: "TTLK_Tra_Vinh Waste Toner Box Full: {#SUPPLY_DESCR}"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: waste-toner
        - name: Printer Alerts Discovery
          type: SNMP_AGENT
          snmp_oid: discovery[{#ALERT_CODE},1.3.6.1.2.1.43.18.1.1.7.1,{#ALERT_SEV},1.3.6.1.2.1.43.18.1.1.2.1,{#ALERT_GROUP},1.3.6.1.2.1.43.18.1.1.4.1]
          key: printer.alerts.discovery
          delay: 1m
          interface_ref: if1
          description: Tu dong phat hien canh bao loi phan cung tu prtAlertTable.
          item_prototypes:
            - name: "Alert [{#SNMPINDEX}]: Description"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.18.1.1.8.1.{#SNMPINDEX}
              key: printer.alert.description[{#SNMPINDEX}]
              delay: 1m
              history: 7d
              trends: "0"
              value_type: CHAR
              interface_ref: if1
              tags:
                - tag: scope
                  value: alerts
            - name: "Alert [{#SNMPINDEX}]: Severity Level"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.18.1.1.2.1.{#SNMPINDEX}
              key: printer.alert.severity[{#SNMPINDEX}]
              delay: 1m
              history: 7d
              trends: 365d
              value_type: UNSIGNED
              interface_ref: if1
              tags:
                - tag: scope
                  value: alerts
              trigger_prototypes:
                - expression: last(/TTLK_Tra_Vinh/printer.alert.severity[{#SNMPINDEX}])=3
                  name: "TTLK_Tra_Vinh Warning [{#SNMPINDEX}]: {ITEM.VALUE1}"
                  event_name: "Printer Warning: {?last(//printer.alert.description[{#SNMPINDEX}])}"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: hardware-alert
                - expression: last(/TTLK_Tra_Vinh/printer.alert.severity[{#SNMPINDEX}])>=4
                  name: "TTLK_Tra_Vinh Hardware Error [{#SNMPINDEX}]: {ITEM.VALUE1}"
                  event_name: "Printer Hardware Error: {?last(//printer.alert.description[{#SNMPINDEX}])}"
                  priority: HIGH
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: hardware-error
      valuemaps:
        - name: Service state
          mappings:
            - value: "0"
              newvalue: Down
            - value: "1"
              newvalue: Up
        - name: hrDeviceStatus
          mappings:
            - value: "1"
              newvalue: Unknown
            - value: "2"
              newvalue: Running
            - value: "3"
              newvalue: Warning
            - value: "4"
              newvalue: Testing
            - value: "5"
              newvalue: Down
        - name: Ricoh Waste Toner
          mappings:
            - value: "1"
              newvalue: Normal (OK)
            - value: "2"
              newvalue: Near Full
            - value: "3"
              newvalue: Full
