                  value: waste-toner
      discovery_rules:
        - name: Supplies Discovery
          type: SNMP_AGENT
          snmp_oid: discovery[{#SUPPLY_DESCR},1.3.6.1.2.1.43.11.1.1.6.1,{#SUPPLY_MAX},1.3.6.1.2.1.43.11.1.1.8.1,{#SUPPLY_TYPE},1.3.6.1.2.1.43.11.1.1.5.1]
          key: printer.supplies.discovery
          delay: 1h
          interface_ref: if1
          description: Kham pha tu dong hop muc va hop muc thai tu prtMarkerSuppliesTable.
          item_prototypes:
            - name: "Supply: {#SUPPLY_DESCR} (Level Raw)"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.{#SNMPINDEX}
              key: printer.supply.level.raw[{#SNMPINDEX}]
              delay: 10m
              history: 7d
              trends: 365d
              value_type: FLOAT
              units: "%"
              interface_ref: if1
              tags:
                - tag: scope
                  value: supplies
                - tag: supply
                  value: "{#SUPPLY_DESCR}"
            - name: "Supply: {#SUPPLY_DESCR} (Level %)"
              type: CALCULATED
              key: printer.supply.level.percent[{#SNMPINDEX}]
              delay: 10m
              history: 14d
              trends: 365d
              value_type: FLOAT
              units: "%"
              params: last(//printer.supply.level.raw[{#SNMPINDEX}])
              tags:
                - tag: scope
                  value: supplies
                - tag: supply
                  value: "{#SUPPLY_DESCR}"
              trigger_prototypes:
                - expression: last(/AC_Kaizen/printer.supply.level.percent[{#SNMPINDEX}])<15 and last(/AC_Kaizen/printer.supply.level.percent[{#SNMPINDEX}])>=0 and {#SUPPLY_TYPE}<>4
                  name: "AC_Kaizen Supply Low: {#SUPPLY_DESCR} (< 15%)"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: supplies
                - expression: last(/AC_Kaizen/printer.supply.level.percent[{#SNMPINDEX}])<=2 and last(/AC_Kaizen/printer.supply.level.percent[{#SNMPINDEX}])>=0 and {#SUPPLY_TYPE}<>4
                  name: "AC_Kaizen Supply Empty: {#SUPPLY_DESCR} (<= 2%)"
                  priority: HIGH
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: supplies
                - expression: last(/AC_Kaizen/printer.supply.level.percent[{#SNMPINDEX}])<=10 and {#SUPPLY_TYPE}=4
                  name: "AC_Kaizen Waste Toner Box Full: {#SUPPLY_DESCR}"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: waste-toner
        - name: Printer Alerts Discovery
          type: SNMP_AGENT
          snmp_oid: discovery[{#ALERT_CODE},1.3.6.1.2.1.43.18.1.1.7.1,{#ALERT_SEV},1.3.6.1.2.1.43.18.1.1.2.1,{#ALERT_GROUP},1.3.6.1.2.1.43.18.1.1.4.1]
          key: printer.alerts.discovery
          delay: 1m
          interface_ref: if1
          description: Tu dong phat hien canh bao loi phan cung tu prtAlertTable.
          item_prototypes:
            - name: "Alert [{#SNMPINDEX}]: Description"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.18.1.1.8.1.{#SNMPINDEX}
              key: printer.alert.description[{#SNMPINDEX}]
              delay: 1m
              history: 7d
              trends: "0"
              value_type: CHAR
              interface_ref: if1
              tags:
                - tag: scope
                  value: alerts
            - name: "Alert [{#SNMPINDEX}]: Severity Level"
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.2.1.43.18.1.1.2.1.{#SNMPINDEX}
              key: printer.alert.severity[{#SNMPINDEX}]
              delay: 1m
              history: 7d
              trends: 365d
              value_type: UNSIGNED
              interface_ref: if1
              tags:
                - tag: scope
                  value: alerts
              trigger_prototypes:
                - expression: last(/AC_Kaizen/printer.alert.severity[{#SNMPINDEX}])=3
                  name: "AC_Kaizen Warning [{#SNMPINDEX}]: {ITEM.VALUE1}"
                  event_name: "Printer Warning: {?last(//printer.alert.description[{#SNMPINDEX}])}"
                  priority: WARNING
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: hardware-alert
                - expression: last(/AC_Kaizen/printer.alert.severity[{#SNMPINDEX}])>=4
                  name: "AC_Kaizen Hardware Error [{#SNMPINDEX}]: {ITEM.VALUE1}"
                  event_name: "Printer Hardware Error: {?last(//printer.alert.description[{#SNMPINDEX}])}"
                  priority: HIGH
                  manual_close: "YES"
                  tags:
                    - tag: class
                      value: hardware-error
      valuemaps:
        - name: Service state
          mappings:
            - value: "0"
              newvalue: Down
            - value: "1"
              newvalue: Up
        - name: hrDeviceStatus
          mappings:
            - value: "1"
              newvalue: Unknown
            - value: "2"
              newvalue: Running
            - value: "3"
              newvalue: Warning
            - value: "4"
              newvalue: Testing
            - value: "5"
              newvalue: Down
        - name: Ricoh Waste Toner
          mappings:
            - value: "1"
              newvalue: Normal (OK)
            - value: "2"
              newvalue: Near Full
            - value: "3"
              newvalue: Full

    # =========================================================================
    # Host 5: TTLK_Tra_Vinh (192.168.85.200 - Ricoh Network Printer Mono MFP)
    # =========================================================================
    - host: TTLK_Tra_Vinh
      name: TTLK_Tra_Vinh (192.168.85.200 - Ricoh Network Printer)
      description: May in chi nhanh TTLK Tra Vinh - 192.168.85.200
      status: ENABLED
      groups:
        - name: Applications
      interfaces:
        - default: "YES"
          type: SNMP
          useip: "YES"
          ip: 192.168.85.200
          dns: ""
          port: "161"
          details:
            version: SNMPV2
            community: "{$SNMP_COMMUNITY}"
          interface_ref: if1
      inventory_mode: DISABLED
      macros:
        - macro: "{$SNMP_COMMUNITY}"
          value: public
      items:
        # --- 1. Connectivity & Performance ---
        - name: "Printer: ICMP ping"
          type: SIMPLE
          key: icmpping
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          interface_ref: if1
          description: Kiem tra tinh san sang cua may in qua ICMP Ping.
          valuemap:
            name: Service state
          tags:
            - tag: scope
              value: availability
          triggers:
            - expression: max(/TTLK_Tra_Vinh/icmpping,#3)=0
              name: TTLK_Tra_Vinh is unreachable (ICMP ping failed)
              priority: DISASTER
              description: May in khong phan hoi ICMP Ping trong 3 lan kiem tra lien tiep.
              tags:
                - tag: class
                  value: connectivity
        - name: "Printer: ICMP response time"
          type: SIMPLE
          key: icmppingsec
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: s
          interface_ref: if1
          description: Thoi gian phan hoi ICMP ping (Round-trip time).
          tags:
            - tag: scope
              value: performance

        # --- 2. Identity & Hardware Specifications ---
        - name: "System: Device description"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: system.descr
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: Mo ta chi tiet he thong tu sysDescr.
          tags:
            - tag: scope
              value: identity
        - name: "System: Device name"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: system.name
          delay: 1h
          history: 7d
          trends: "0"
          value_type: CHAR
          interface_ref: if1
          description: Ten dinh danh mang cua may in (sysName).
          tags:
            - tag: scope
              value: identity
        - name: "System: Uptime"
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: system.uptime
          delay: 5m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          units: uptime
          interface_ref: if1
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - "0.01"
          description: Thoi gian may in hoat dong lien tuc (sysUpTime).
          tags:
            - tag: scope
              value: availability
          triggers:
            - expression: change(/TTLK_Tra_Vinh/system.uptime)<0 and last(/TTLK_Tra_Vinh/system.uptime)<300
              name: TTLK_Tra_Vinh has just rebooted
              priority: INFO
              description: May in vua duoc khoi dong lai dot ngot.
              manual_close: "YES"
              tags:
                - tag: class
                  value: reboot
