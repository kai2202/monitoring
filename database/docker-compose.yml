services:
  # 1. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: fleetmonitor-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fleetmonitor
      POSTGRES_USER: fleet_admin
      POSTGRES_PASSWORD: fleet_secret_2026
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_admin -d fleetmonitor"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fleetmonitor_net

  # 2. MinIO S3 Object Storage (Ảnh nghiệm thu, File đính kèm)
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: fleetmonitor-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API Endpoint
      - "9001:9001"   # MinIO Web Console UI
    environment:
      MINIO_ROOT_USER: fleet_minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_2026
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleetmonitor_net

  # 3. MinIO Bucket Initializer (Tự động khởi tạo buckets khi MinIO ready)
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T12-08-02Z
    container_name: fleetmonitor-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Đang kiểm tra kết nối MinIO Server...';
      until /usr/bin/mc alias set localminio http://minio:9000 fleet_minio_admin minio_secret_2026; do
        echo 'Chờ MinIO sẵn sàng...';
        sleep 2;
      done;
      echo 'Tạo bucket lưu ảnh nghiệm thu in test...';
      /usr/bin/mc mb --ignore-existing localminio/fleetmonitor-proofs;
      echo 'Tạo bucket lưu tài liệu kỹ thuật & SOP...';
      /usr/bin/mc mb --ignore-existing localminio/fleetmonitor-docs;
      echo 'Thiết lập quyền tải công khai cho ảnh in test...';
      /usr/bin/mc anonymous set download localminio/fleetmonitor-proofs;
      echo 'Khởi tạo MinIO Buckets thành công!';
      exit 0;
      "
    networks:
      - fleetmonitor_net

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  fleetmonitor_net:
    driver: bridge

