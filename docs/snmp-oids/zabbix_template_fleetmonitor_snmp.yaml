zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: ae2add8fd07a49a1bc4970bf6b570a33
      name: 'Templates/FleetMonitor Network Printers'
  templates:
    - uuid: 833834708b78406faac53c702977050e
      template: 'Template FleetMonitor SNMP Printer'
      name: 'Template FleetMonitor SNMP Printer'
      description: |
        Zabbix 7.0 LTS Template chuẩn hóa giám sát máy in mạng (RFC 3805, RFC 2790 & Vendor Private MIBs).
        Tuân thủ nghiêm ngặt nguyên tắc AGENTS.md:
        - Thu thập toàn diện: Bộ đếm trang đời máy (Life count), Mực CMYK, Hộp mực thải, Mã lỗi SC/E-code.
        - LOẠI TRỪ HOÀN TOÀN các cảnh báo khay giấy/hết giấy và nắp cửa máy in (vận hành thủ công tại chỗ).
      groups:
        - name: 'Templates/FleetMonitor Network Printers'
      macros:
        - macro: '{$SNMP_COMMUNITY}'
          value: 'public'
          description: 'SNMP v2c community string (có thể ghi đè theo từng Site/Host).'
        - macro: '{$TONER_WARN_PCT}'
          value: '15'
          description: 'Ngưỡng cảnh báo mực thấp (%).'
      items:
        - uuid: 7dbfae739f1f45fe9ab3d67cf7541571
          name: 'Kiểm Tra Mạng ICMP Ping'
          type: SIMPLE
          key: 'icmpping'
          delay: 30s
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          description: '0: Mất kết nối mạng (ICMP Down), 1: Thông mạng (ICMP Up).'
          triggers:
            - uuid: e7eec88146ad4ca7b0516b414c916b7b
              expression: 'max(/Template FleetMonitor SNMP Printer/icmpping,#3)=0'
              name: 'Mất kết nối mạng ICMP (3 lần liên tiếp)'
              priority: HIGH

        - uuid: 1d11a57a1da54fb89210573dcba2cf0d
          name: 'Số Serial Thiết Bị (prtGeneralSerialNumber)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.43.5.1.1.17.1'
          key: 'printer.serial'
          delay: 1d
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Serial Number gốc đọc từ Printer-MIB.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d

        - uuid: 8bbe99a7692d4a6aac64f790201eb9a7
          name: 'Tên Dòng Máy (hrDeviceDescr)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.25.3.2.1.3.1'
          key: 'printer.model'
          delay: 1d
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Model thiết bị đọc từ Host-Resources MIB.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d

        - uuid: 1e9e6993ce3441aba1495aca06db7845
          name: 'SNMP Trap Fallback (Hứng OID Lạ)'
          type: SNMP_TRAP
          key: 'snmptrap.fallback'
          history: 14d
          trends: '0'
          value_type: LOG
          description: 'Hứng các mã lỗi / OID riêng của hãng chưa khai báo trước.'
          triggers:
            - uuid: 3e5532f8be644fca8cc39df46b1d73b7
              expression: 'length(last(/Template FleetMonitor SNMP Printer/snmptrap.fallback))>0'
              name: 'Phát hiện SNMP Trap lỗi mới: {ITEM.VALUE}'
              priority: AVERAGE
              manual_close: 'YES'

        - uuid: f19b0333416a4dfd960339964f6f538c
          name: 'Trạng Thái Thiết Bị (hrDeviceStatus)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.25.3.2.1.5.1'
          key: 'printer.device_status'
          delay: 30s
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          description: '1: unknown, 2: running (khỏe mạnh), 3: warning, 4: testing, 5: down'
          triggers:
            - uuid: b0898d73e7144bf5a24b7e5aa74c16f0
              expression: 'last(/Template FleetMonitor SNMP Printer/printer.device_status)=5'
              name: 'Máy in gặp sự cố phần cứng nghiêm trọng (Device Down)'
              priority: HIGH
              manual_close: 'YES'

        - uuid: 6fa1750dfad74cb78e6c99b95dc2b29a
          name: 'Tổng Sản Lượng Trang In Trọn Đời (prtMarkerLifeCount)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.43.10.2.1.4.1.1'
          key: 'printer.counter_total'
          delay: 1h
          history: 30d
          trends: 730d
          value_type: UNSIGNED
          description: 'Marker Life Count - Tổng số trang in cả đời máy từ khi xuất xưởng.'

        - uuid: 7498f798d74044db8d523ae3088c97b0
          name: 'Thông Điệp Màn Hình LCD (prtConsoleDisplayText)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.43.16.5.1.2.1.1'
          key: 'printer.display_text'
          delay: 30s
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Dòng thông báo hiển thị trên bảng điều khiển máy in.'

        - uuid: fc70f1fddc6d469ca553db4df56b0893
          name: 'Ricoh: Mã Lỗi SC Đang Kích Hoạt'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.367.3.2.1.6.1.1.7.1'
          key: 'ricoh.sc_code'
          delay: 30s
          history: 14d
          trends: '0'
          value_type: CHAR
          description: 'Mã lỗi phần cứng máy photo Ricoh (SC541, SC542, SC320...).'
          triggers:
            - uuid: fdce17a1558e4209ab1cbdb9cff41856
              expression: 'length(last(/Template FleetMonitor SNMP Printer/ricoh.sc_code))>0'
              name: 'Ricoh: Phát hiện mã lỗi Service Call {ITEM.VALUE}'
              priority: DISASTER
              manual_close: 'YES'

        - uuid: d563ef5896da4f53bdb2bec301ec3928
          name: 'Ricoh: Tổng Trang In Đen Trắng (Mono Life Count)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.367.3.2.1.2.19.1.0'
          key: 'ricoh.counter_mono'
          delay: 1h
          history: 30d
          trends: 730d
          value_type: UNSIGNED

        - uuid: 0d2c934da6e04b8ab8e4c42096c595ac
          name: 'Ricoh: Tổng Trang In Màu (Color Life Count)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.367.3.2.1.2.19.2.0'
          key: 'ricoh.counter_color'
          delay: 1h
          history: 30d
          trends: 730d
          value_type: UNSIGNED

      discovery_rules:
        - uuid: c28a5c10841e45d1b7079538f8e8bcf5
          name: 'Tự Động Phát Hiện Mực & Hộp Mực Thải (Marker Supplies Discovery)'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SUPPLY_NAME},1.3.6.1.2.1.43.11.1.1.6.1]'
          key: 'printer.supplies.discovery'
          delay: 1h
          item_prototypes:
            - uuid: 544f248f387e4e7ca6dc5ebc949a5b2d
              name: 'Mức Vật Tư: {#SUPPLY_NAME}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.43.11.1.1.9.1.{#SNMPINDEX}'
              key: 'printer.supply.level[{#SNMPINDEX}]'
              delay: 5m
              history: 14d
              trends: 365d
              value_type: FLOAT
              description: 'Mức còn lại của vật tư {#SUPPLY_NAME}. -3: someRemaining (còn mực nhưng không rõ %), -2: unknown, -1: other.'
            - uuid: a8bee5a8003d4b08bef5064e65e542c3
              name: 'Dung Lượng Tối Đa Vật Tư: {#SUPPLY_NAME}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.43.11.1.1.8.1.{#SNMPINDEX}'
              key: 'printer.supply.max[{#SNMPINDEX}]'
              delay: 1d
              history: 7d
              trends: 365d
              value_type: FLOAT
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
          trigger_prototypes:
            - uuid: 9bf8c7e6f56449c0a4622d8094f9c39f
              expression: 'last(/Template FleetMonitor SNMP Printer/printer.supply.level[{#SNMPINDEX}])>=0 and last(/Template FleetMonitor SNMP Printer/printer.supply.max[{#SNMPINDEX}])>0 and (last(/Template FleetMonitor SNMP Printer/printer.supply.level[{#SNMPINDEX}])*100/last(/Template FleetMonitor SNMP Printer/printer.supply.max[{#SNMPINDEX}]))<{$TONER_WARN_PCT}'
              name: 'Cảnh báo mực/vật tư thấp (<{$TONER_WARN_PCT}%): {#SUPPLY_NAME}'
              priority: WARNING

        - uuid: cb3e65ec0b5b4a57a0578d3c20f75697
          name: 'Tự Động Phát Hiện Lỗi Phần Cứng & Kẹt Giấy (prtAlertTable LLD)'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#ALERT_DESC},1.3.6.1.2.1.43.18.1.1.8,{#ALERT_CODE},1.3.6.1.2.1.43.18.1.1.7,{#ALERT_SEV},1.3.6.1.2.1.43.18.1.1.2]'
          key: 'printer.alerts.discovery'
          delay: 1m
          filter:
            conditions:
              - macro: '{#ALERT_DESC}'
                value: '(?i)(cover open|door open|paper empty|tray empty|out of paper)'
                operator: NOT_MATCHES_REGEX
                formulaid: A
          item_prototypes:
            - uuid: 7f3bf5cb39254963bb5f0229c95ea92d
              name: 'Cảnh báo thiết bị [{#ALERT_CODE}]: {#ALERT_DESC}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.43.18.1.1.8.{#SNMPINDEX}'
              key: 'printer.alert.desc[{#SNMPINDEX}]'
              delay: 1m
              history: 14d
              trends: '0'
              value_type: CHAR
              trigger_prototypes:
                - uuid: 50b7ac744fe246cb94e8d3ef7e2c15f9
                  expression: 'length(last(/Template FleetMonitor SNMP Printer/printer.alert.desc[{#SNMPINDEX}]))>0'
                  name: 'Lỗi máy in [{#ALERT_CODE}]: {#ALERT_DESC}'
                  priority: HIGH
                  manual_close: 'YES'

